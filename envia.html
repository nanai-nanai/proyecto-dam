	<h1>ENVÍA TU RESEÑA</h1>
	<div class="formulario">
				<form action="contacto.php" method="post" class="contacto">
					<legend>Reseña:</legend>
					<p>Datos personales</p>
					<div>
						<label for="nombre">Nombre:</label><br>
						<input id="nombre" type="text" name="nombre" placeholder="El nombre o apodo de quien escribe la reseña" required="" />
					</div>
					<div>
						<label for="email">E-mail:</label><br>
						<input id="email" type="email" name="email" placeholder="ejemplo@correo.com" required="" />
					</div>
					<p>Datos del juego</p>
					<div>
						<label for="asunto">Título del juego:</label><br>
						<input id="asunto" type="asunto" />
					</div>
					<div>
						<label for="mensaje">Reseña:</label><br>
						<textarea id="mensaje" name="mensaje" placeholder="Escribe aquí todo el texto de tu reseña" required></textarea>
					</div>
					<div>
						<label for="nota">Nota:</label><br>
						<textarea id="nota" name="nota" placeholder="Puntuación sobre 10" required></textarea>
					</div>
					<input id="submit"  type="submit" name="submit" value="Enviar" />
				</form>
			</div>
</body>
